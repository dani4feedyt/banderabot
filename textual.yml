irritation_levels:
  low:
    - Ти ж щойно вже викликав цю команду, ні?
    - Ось, ваш результат знову...
    - І ще раз...
  medium:
    - Навіщо ти стільки разів викликаєш цю команду?
    - Справа не в тому, що я не можу це знов зробити, але мені здається що ти просто
      намагаєшся мені надокучити
    - Тобі певно ДУЖЕ цікаво подивитися чи скажу я щось інше
  high:
    - Це вже може рахуватися як спам...
    - Так, тепер я знаю що ти це робиш спеціально
    - Ти ж знаєш що я можу змусити тебе зупинитися?
    - Ще декілька разів і я відправлю тебе до муту, я не жартую


