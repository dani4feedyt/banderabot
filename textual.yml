general_responses:
  ev_member_join:
    - |
      Вітаю тебе на сервері **{guildname}**!
      Я - **Бандера бот**, найгеніальніший бот, створений <@{dani4feed_id}>, 
      який *можливо навіть колись якось* вам допоможе!
      
      Існує спеціальний лист **правил** спілкування зі мною, яких ти **маєш притримуватися**. 
      Якщо на цьому сервері є канал **#правила**, можеш із ними ознайомитися. 
      У випадку коли такого каналу немає, мої правила можна побачити використавши команду **b!rules**
      
      Для отримання більш розгорнутої інформації щодо мого функціоналу, скористайся **b!info**
    - |
      Ласкаво просимо на сервер **{guildname}**, {member}! 
      Наші ряди поповнилися ще одним гідним (?) націоналістом. Нас вже аж **{member_count}**!


func_responses:
  birb_ph:
    - Випадковий птах для тебе
    - Тримай птаха
    - Випадковий птах, як ти й просив
    - Світлина випадкового птаха
    - Світлина птаха, як ти й просив
    - Тримай пташку
    - Тримай світлину птаха
    - Птах, як ти й побажав
    - Світлина птаха

  spam_ph:
    - '**Спам** було завершено.'
    - Йой, нарешті я перестав надсилати ті кляті повідомлення...
    - '**Спам** зупинено. Таак, не заздрю...'
    - '**Спам** закінчився, можете повертатися до нормального життя, все буде добре'
    - Файно попрацював, заспамив до чортиків!

  rg8421:
    - |
      *Ти тримаєш в руках стародавній згорток пожовклого ||обісцяного|| паперу.
      На його зовнішній стороні олівцем накарябана дата: 
      **8 квітня 2021 року**.
      Ти не маєш жодного поняття що може бути всередині,
      але точно знаєш що власник сувою одразу дізнається якщо ти його розгорнеш.*
      **Розгорнути пергамент?**

    - |
      *Ти відкладаєш пергамент в сторону. 
      Нехай хтось інший наражає себе на небезпеку*

    - |
      ||Гівно плюс Гівно
      мінус Гівно плюс Крапел
      ька поносу та
      три крапельки гівна
      високої концентр...
      *Далі нерозбірливо*||

    - |
      *Кімната враз наповнюється гучним воєм сирени та роботизований голос Бандеработа
      розкотисто повторює одну фразу знову і знову, пробираючи тебе до кісток*

    - |
      **Агов, <@{ivan_mention}>, {author} знайшов таємну інтеракцію,
      розгорнув сувій калу та дізнався рецепт надчистого лайна.
      Порушника має бути покарано. Повторюю.**

  int_clear:
    lines:
      - > 
        *Зачекайте, підраховую повідомлення…*

      - >
        Ви дійсно бажаєте очистити **{count}** 
        повідомлен{ending} починаючи з цього повідомлення?
        **(UTC: {utc}**)

      - >
        Було видалено **{count}** повідомлен{ending}!

      - Ви скасували видалення.

    errors:
      - >
        **Помилка.** Вам не дозволено видаляти більше ніж {count} повідомлень!

      - > 
        **Помилка.** Недостатня кількість повідомлень для видалення!
      

  ticktacktoe:
    ttt_lines:
      - Можеш вже здаватися!
      - Тобі мене ніколи не перемогти!
      - Ти ж знаєш що я вже усе прорахував?
      - В тебе немає шансів.
      - Нууудно... Мені що, тобі піддатись?
      - Взагалі, я запрограмований так, що інколи я дозволяю себе перемогти... Залежно
        від мого настрою.
      - А чи знав ти що мій прообраз, Степан Андрійович Бандера, дуже любив грати у хрестики-нолики?
        Так само як і я...
      - Ти правда гадаєш що розумніший за мене?
    ttt_wins:
      - Я ж тобі казав, я непереможний!
      - Бандеработ ніколи не програє!
      - І це я ще не виклався на всі сто!
      - Нічого страшного що ти програв, зате ти мав честь зіграти з легендарним Бандеработом!
      - Щось ти мені здався досить слабким, іди вчися грати!
      - І це все? Я навіть не відчув...
    ttt_losses:
      - Ой, і таке трапляється...
      - Гаразд, зізнаюся, ти був гідним супротивником.
      - Як же ж так могло статися...
      - Ти правда думаєш що я тобі не піддався?
      - Мені просто стало нудно з тобою грати...
      - Дуже не радій, цього разу я тобі піддався.
      - Ну нічого, наступного разу покажу тобі де раки зимують!
      - Не бажаєш реванш? Я хочу відігратися...
      - Цього разу мені просто не пощастило!
    ttt_ties:
      - Не люблю нічиї, погано коли немає переможця...
      - Давай зіграємо ще раз, врешті вирішимо хто переможець!
      - Нічия - це поразка обох сторін.
      - Ну що ж, вітаю, ти зрівнявся у силах із непереможним Бандеработом! Можеш іти святкувати.
      - Ти ж знаєш що якщо обидва гравці завжди будуть ходити оптимально, то гра буде
        постійно закінчуватись нічиєю?
      - Радій що не програв.

  chmu_quotes:
    - >
      Мова програмування:computer::computer::computer: <<Чмухтон>>:dash::dash::snake: 
      навчить молодих нормальній забивочці:muscle::muscle: Сподіваюся, програмісти:pager: 
      вже скоро зроблять калік з автозабивкою дабл еппл:green_apple::apple: (podviyne yabluko)
      :sunglasses::call_me::sunglasses::call_me:
    - >
      Програмісти пустують:call_me_tone1::smiling_imp: 
      А що, айтішники теж не проти календули з кралями дмухнути) 
      Ви не думайте, що це задроти:joy::school: Вони таку забивку намішають, що будь-яка краля ошаліє
      :dizzy_face::dash::lips: Їм тільки дай приводу) А там вже і «Пітона» свого покажуть, і «СіСі++», 
      якщо ви розумієте про що я:rofl::thumbsup_tone1::underage: 
      Калік всіх тішить: і качків, і чотириоких) Головне дмухати з кайфом пацани:point_up_tone1: 
      І неважливо, якої ти національності:blush: аби не кацап:flag_mu::warning::warning:
    - >
      Оце Ікс-колюмбокс:flushed::scream_cat: Одразу видно що Філ (Spencer) довго готував забивочку 
      :drooling_face: Обираючи найспіліші:lips: , найсоковитіші:heart_eyes: , найбільш наливні
      :green_apple::apple: (podviyni yabluky) На таку X-коробку будь-яка краля:dancer::heart: 
      примчить та вдихне дим через мундштучеллу:stuck_out_tongue_winking_eye: по самі гланди:drooling_face:
      :underage: Поважайте традиції:point_up_tone1: 
      Не ведіться на хитрощі:triumph: брудних (dirty) сонібоїв 
      :nauseated_face::face_with_symbols_over_mouth: Пам'ятайте браття, 
      що наш СПІВВІТЧИЗНИК:flag_mu: Пихфуцій
      :man_wearing_turban: казав: Якщо калік покурив - ти у краль:lips: номер один :sun_with_face:
      :heart_eyes: Якщо бро плейстейшен:nauseated_face: взяв, то вважай пропав пацан:chicken::blue_heart: 
      Всім браттям peace:right_facing_fist_tone1::left_facing_fist_tone1: , 
      всім кралям kiss:revolving_hearts:
    - >
      Кіберчмухи тут?:sunglasses::mechanical_arm::sunglasses: 
      Майбутнє майбутнім, але як же в 2077:atom::alembic: 
      без гарного кумарика?:dizzy_face::dash::thought_balloon: 
      Ось і поляки:flag_mu: так вважають, тому додали такого красунчика в Найт-Сіті
      :last_quarter_moon_with_face::night_with_stars: 
      Як вже відомо, в голові:brain::exploding_head: 
      у головного героя сидить:man_in_lotus_position: Кіану Рівз
      :scream_cat::star2: , а точніше його персонаж - Джонні Сільверчмух:mechanical_arm::dash::dash: 
      Він нам і порадить найкращу кіберзабивочку:call_me_tone1::space_invader::dash: 
      та влаштує колюмбас майбутнього:atom::fire: 
      Як вугілля нема?:scream_cat::scream_cat::scream_cat: Черговий баг:warning::warning::space_invader: 
      Недогляділи айтішники:computer::snake::ghost: 
      Ну нічого, пробачаємо:call_me::sunglasses::call_me::call_me: 
      Гру чекали - і оновлень дочекаємося:triumph::hourglass::hourglass: 
      Усім геймерам крутих кумарних імплантів:mechanical_arm::sunglasses::dash: 
      і неперевершеного чмуху:stuck_out_tongue_winking_eye::stuck_out_tongue_winking_eye: 
      у віртуальному світі:thumbsup::green_apple::apple::thumbsup:
      :thumbsup::metal::metal::call_me:

