name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and restart bot container
        run: |
           sudo /mnt/Pull1/Scripts/docker-compose -f /mnt/Pull1/Scripts/banderabot/docker-compose.yml down
           sudo /mnt/Pull1/Scripts/docker-compose -f /mnt/Pull1/Scripts/banderabot/docker-compose.yml up -d --build
